<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Wizard - Challenge Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #fff1f2; /* Rose tint */
            overflow: hidden;
            touch-action: none;
        }
        #home-link {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            color: #be123c;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 100;
        }
        .letter-tile {
            width: 60px; /* Slightly smaller to fit more tiles */
            height: 60px;
            background: white;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: #be123c;
            box-shadow: 0 5px 0 #9f1239;
            cursor: grab;
            user-select: none;
            transition: transform 0.1s, background-color 0.2s, border-color 0.2s;
            border: 2px solid #fda4af;
            z-index: 10;
        }
        .letter-tile:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #9f1239;
            cursor: grabbing;
        }
        .letter-slot {
            width: 70px;
            height: 70px;
            border: 3px dashed #fda4af;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.5);
            transition: border-color 0.3s;
        }
        
        /* Error States */
        .letter-slot.wrong {
            border-color: #ef4444;
            background-color: #fee2e2;
        }
        .letter-tile.wrong-tile {
            background-color: #fee2e2;
            color: #b91c1c;
            border-color: #ef4444;
            box-shadow: 0 5px 0 #b91c1c;
        }

        /* Animations */
        .bounce {
            animation: bounce 0.6s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        #victory-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(190, 18, 60, 0.9);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        /* Timer Bar */
        #timer-container {
            width: 100%;
            max-width: 300px;
            height: 12px;
            background: #fecdd3;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
            border: 2px solid #fb7185;
        }
        #timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #fb7185, #e11d48);
            transform-origin: left;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <a href="https://mlyard.github.io/auroras_playground/home.html" id="home-link">🏠 Home</a>

    <div class="text-center mt-12 mb-2 w-full flex flex-col items-center">
        <h1 class="text-4xl font-bold text-rose-800 mb-2">Word Wizard</h1>
        <div id="timer-container">
            <div id="timer-bar"></div>
        </div>
        <p class="text-rose-600 text-sm font-bold animate-pulse" id="timer-text">Time is ticking!</p>
    </div>

    <!-- Main Game Area -->
    <div class="flex flex-col items-center gap-6 w-full max-w-2xl relative">
        
        <!-- Image Display -->
        <div id="emoji-display" class="text-[8rem] drop-shadow-xl transition-all duration-300 hover:scale-110 cursor-default leading-none">
            🐱
        </div>

        <!-- Word Slots -->
        <div id="slots-container" class="flex gap-2 justify-center min-h-[80px] flex-wrap px-4">
            <!-- Slots will be generated here -->
        </div>

        <!-- Letter Tray -->
        <div class="bg-white/60 p-6 rounded-3xl border-4 border-rose-200 w-full shadow-lg">
            <div id="tray" class="flex flex-wrap justify-center gap-3 min-h-[80px]">
                <!-- Scrambled letters + Decoys will be here -->
            </div>
        </div>

        <div class="flex gap-4 mt-2">
            <button onclick="resetCurrentLevel()" class="px-6 py-2 bg-rose-200 hover:bg-rose-300 text-rose-800 font-bold rounded-xl transition-all active:scale-95 shadow-sm">
                Restart
            </button>
            <button onclick="nextLevel()" id="skip-btn" class="px-6 py-2 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl shadow-lg transition-all active:scale-95">
                Skip
            </button>
        </div>
    </div>

    <!-- Victory Modal -->
    <div id="victory-modal">
        <div class="bg-white p-10 rounded-[40px] text-center shadow-2xl max-w-sm border-8 border-rose-300 mx-4">
            <div class="text-8xl mb-4">✨</div>
            <h2 class="text-4xl font-black text-rose-800 mb-2">SPELL-TACULAR!</h2>
            <p class="text-lg text-gray-600 mb-6">You're a true genius!</p>
            <button onclick="nextLevel(); closeModal();" class="w-full bg-rose-600 hover:bg-rose-700 text-white py-4 rounded-2xl font-bold text-xl shadow-xl transition-all active:scale-95">Next Challenge</button>
        </div>
    </div>

    <!-- Time's Up Modal -->
    <div id="timeout-modal" style="display: none;" class="fixed inset-0 bg-rose-900/90 backdrop-blur-sm flex items-center justify-center z-[200]">
        <div class="bg-white p-10 rounded-[40px] text-center shadow-2xl max-w-sm border-8 border-orange-300 mx-4">
            <div class="text-7xl mb-4">⏰</div>
            <h2 class="text-4xl font-black text-orange-600 mb-2">TIME'S UP!</h2>
            <p class="text-lg text-gray-600 mb-6">Don't give up, try again!</p>
            <button onclick="resetCurrentLevel(); closeTimeoutModal();" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-4 rounded-2xl font-bold text-xl shadow-xl transition-all active:scale-95">Try Again</button>
        </div>
    </div>

    <script>
        const levels = [
            { word: "CAT", emoji: "🐱" },
            { word: "DOG", emoji: "🐶" },
            { word: "SUN", emoji: "☀️" },
            { word: "FISH", emoji: "🐠" },
            { word: "TREE", emoji: "🌳" },
            { word: "BOOK", emoji: "📚" },
            { word: "MOON", emoji: "🌙" },
            { word: "BIRD", emoji: "🐦" },
            { word: "APPLE", emoji: "🍎" },
            { word: "CAR", emoji: "🚗" },
            { word: "STAR", emoji: "⭐" },
            { word: "DUCK", emoji: "🦆" },
            { word: "TIGER", emoji: "🐯" },
            { word: "HOUSE", emoji: "🏠" },
            { word: "PIZZA", emoji: "🍕" },
            { word: "ROBOT", emoji: "🤖" },
            { word: "PLANE", emoji: "✈️" },
            { word: "HEART", emoji: "❤️" },
            { word: "ROCKET", emoji: "🚀" },
            { word: "BANANA", emoji: "🍌" },
            { word: "MONKEY", emoji: "🐒" },
            { word: "PENCIL", emoji: "✏️" },
            { word: "FLOWER", emoji: "🌸" },
            { word: "TURTLE", emoji: "🐢" },
            { word: "SNAKE", emoji: "🐍" },
            { word: "WHALE", emoji: "🐳" },
            { word: "GHOST", emoji: "👻" },
            { word: "DRUM", emoji: "🥁" },
            { word: "KITE", emoji: "🪁" },
            { word: "LION", emoji: "🦁" },
            { word: "MOUSE", emoji: "🐭" },
            { word: "PANDA", emoji: "🐼" },
            { word: "FROG", emoji: "🐸" },
            { word: "CAKE", emoji: "🎂" },
            { word: "MILK", emoji: "🥛" },
            { word: "EGG", emoji: "🥚" },
            { word: "BEAR", emoji: "🐻" },
            { word: "TRAIN", emoji: "🚂" },
            { word: "SHIP", emoji: "🚢" },
            { word: "BIKE", emoji: "🚲" },
            { word: "HAT", emoji: "🎩" },
            { word: "SHOE", emoji: "👟" },
            { word: "BALL", emoji: "⚽" },
            { word: "CLOUD", emoji: "☁️" }
        ];

        let currentLevelIndex = 0;
        let draggedTile = null;
        let sourceContainer = null;
        let timerInterval = null;
        const TIME_LIMIT = 30; // 30 seconds
        let timeLeft = TIME_LIMIT;

        const emojiDisplay = document.getElementById('emoji-display');
        const slotsContainer = document.getElementById('slots-container');
        const tray = document.getElementById('tray');
        const timerBar = document.getElementById('timer-bar');

        function initGame() {
            loadLevel(currentLevelIndex);
        }

        function generateDistractors(word, count) {
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            let distractors = [];
            while (distractors.length < count) {
                const char = alphabet[Math.floor(Math.random() * alphabet.length)];
                // Don't add if it's already in the word or already picked
                if (!word.includes(char) && !distractors.includes(char)) {
                    distractors.push(char);
                }
            }
            return distractors;
        }

        function loadLevel(index) {
            clearInterval(timerInterval);
            const level = levels[index];
            emojiDisplay.textContent = level.emoji;
            emojiDisplay.classList.remove('bounce');
            
            // Clear containers
            slotsContainer.innerHTML = '';
            tray.innerHTML = '';

            // Create Slots
            for (let i = 0; i < level.word.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'letter-slot';
                slot.dataset.index = i;
                setupDropZone(slot);
                slotsContainer.appendChild(slot);
            }

            // Create Letters: Target Word + 3 Distractors
            const targetLetters = level.word.split('');
            const distractorLetters = generateDistractors(level.word, 3);
            const allLetters = [...targetLetters, ...distractorLetters].sort(() => Math.random() - 0.5);

            allLetters.forEach(char => {
                const tile = createTile(char);
                tray.appendChild(tile);
            });

            setupDropZone(tray);
            startTimer();
        }

        function startTimer() {
            timeLeft = TIME_LIMIT;
            updateTimerVisuals();
            
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                updateTimerVisuals();
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showTimeoutModal();
                    playFailureSound();
                }
            }, 100);
        }

        function updateTimerVisuals() {
            const percentage = (timeLeft / TIME_LIMIT) * 100;
            timerBar.style.width = `${percentage}%`;
            
            if (percentage < 30) {
                timerBar.style.background = '#ef4444'; // Red warning
            } else {
                timerBar.style.background = 'linear-gradient(90deg, #fb7185, #e11d48)';
            }
        }

        function createTile(char) {
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.textContent = char;
            tile.draggable = true;
            
            tile.addEventListener('dragstart', handleDragStart);
            tile.addEventListener('touchstart', handleTouchStart, {passive: false});
            
            return tile;
        }

        function setupDropZone(element) {
            element.addEventListener('dragover', e => e.preventDefault());
            element.addEventListener('drop', handleDrop);
        }

        // Drag & Drop Handlers
        function handleDragStart(e) {
            draggedTile = e.target;
            sourceContainer = draggedTile.parentElement;
            resetErrorState(); // Clear red styles on interaction
        }

        function handleDrop(e) {
            e.preventDefault();
            const target = e.target.closest('.letter-slot') || e.target.closest('#tray');
            
            if (!target) return;

            // Logic for moving tiles
            if (target.id === 'tray') {
                target.appendChild(draggedTile);
            } else if (target.classList.contains('letter-slot')) {
                if (target.children.length === 0) {
                    target.appendChild(draggedTile);
                } else {
                    // Swap if slot occupied
                    const existingTile = target.children[0];
                    if (sourceContainer) sourceContainer.appendChild(existingTile);
                    target.appendChild(draggedTile);
                }
            }
            
            playClickSound();
            checkWin();
        }

        // Touch Handlers
        function handleTouchStart(e) {
            e.preventDefault();
            draggedTile = e.target;
            sourceContainer = draggedTile.parentElement;
            resetErrorState();
            
            draggedTile.style.position = 'fixed';
            draggedTile.style.zIndex = '1000';
            
            window.addEventListener('touchmove', handleTouchMove, {passive: false});
            window.addEventListener('touchend', handleTouchEnd);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            draggedTile.style.left = (touch.clientX - 30) + 'px';
            draggedTile.style.top = (touch.clientY - 30) + 'px';
        }

        function handleTouchEnd(e) {
            const touch = e.changedTouches[0];
            draggedTile.style.position = '';
            draggedTile.style.zIndex = '';
            draggedTile.style.left = '';
            draggedTile.style.top = '';
            
            window.removeEventListener('touchmove', handleTouchMove);
            window.removeEventListener('touchend', handleTouchEnd);

            const elementUnder = document.elementFromPoint(touch.clientX, touch.clientY);
            const target = elementUnder?.closest('.letter-slot') || elementUnder?.closest('#tray');

            if (target) {
                if (target.id === 'tray') {
                    target.appendChild(draggedTile);
                } else if (target.classList.contains('letter-slot')) {
                    if (target.children.length === 0) {
                        target.appendChild(draggedTile);
                    } else {
                        const existingTile = target.children[0];
                        sourceContainer.appendChild(existingTile);
                        target.appendChild(draggedTile);
                    }
                }
            } else {
                sourceContainer.appendChild(draggedTile);
            }
            
            playClickSound();
            checkWin();
        }

        function resetErrorState() {
            const slots = document.querySelectorAll('.letter-slot');
            const tiles = document.querySelectorAll('.letter-tile');
            slotsContainer.classList.remove('shake');
            slots.forEach(s => s.classList.remove('wrong'));
            tiles.forEach(t => t.classList.remove('wrong-tile'));
        }

        function triggerError() {
            slotsContainer.classList.remove('shake');
            void slotsContainer.offsetWidth; // Trigger reflow
            slotsContainer.classList.add('shake');
            
            const filledSlots = document.querySelectorAll('.letter-slot');
            filledSlots.forEach(slot => {
                slot.classList.add('wrong');
                if(slot.children[0]) slot.children[0].classList.add('wrong-tile');
            });
            playErrorSound();
        }

        function checkWin() {
            const slots = Array.from(slotsContainer.children);
            const currentWord = slots.map(slot => slot.children[0] ? slot.children[0].textContent : '').join('');
            const targetWord = levels[currentLevelIndex].word;
            
            // Check if all slots are filled
            const isFull = slots.every(slot => slot.children.length > 0);

            if (isFull) {
                if (currentWord === targetWord) {
                    clearInterval(timerInterval);
                    playWinSound();
                    emojiDisplay.classList.add('bounce');
                    setTimeout(() => {
                        document.getElementById('victory-modal').style.display = 'flex';
                    }, 500);
                } else {
                    // Full but wrong!
                    triggerError();
                }
            }
        }

        function closeModal() {
            document.getElementById('victory-modal').style.display = 'none';
        }

        function showTimeoutModal() {
            document.getElementById('timeout-modal').style.display = 'flex';
        }

        function closeTimeoutModal() {
            document.getElementById('timeout-modal').style.display = 'none';
        }

        function nextLevel() {
            currentLevelIndex = (currentLevelIndex + 1) % levels.length;
            loadLevel(currentLevelIndex);
        }

        function resetCurrentLevel() {
            loadLevel(currentLevelIndex);
        }

        function playClickSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        function playWinSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.6);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.6);
            } catch (e) {}
        }

        function playErrorSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {}
        }

        function playFailureSound() {
             try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {}
        }

        initGame();
    </script>
</body>
</html>
