<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Wizard - Laurel Ridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #fff1f2; /* Rose tint */
            overflow: hidden;
            touch-action: none;
        }
        #home-link {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            color: #be123c;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 100;
        }
        .letter-tile {
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: #be123c;
            box-shadow: 0 6px 0 #9f1239;
            cursor: grab;
            user-select: none;
            transition: transform 0.1s;
            border: 2px solid #fda4af;
        }
        .letter-tile:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #9f1239;
            cursor: grabbing;
        }
        .letter-slot {
            width: 80px;
            height: 80px;
            border: 3px dashed #fda4af;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.5);
        }
        /* Animation for correct answer */
        .bounce {
            animation: bounce 0.6s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        #victory-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(190, 18, 60, 0.9);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <a href="https://mlyard.github.io/auroras_playground/home.html" id="home-link">🏠 Home</a>

    <div class="text-center mt-8 mb-4">
        <h1 class="text-4xl font-bold text-rose-800 mb-2">Word Wizard</h1>
        <p class="text-rose-600 text-lg">Spell the word shown in the picture!</p>
    </div>

    <!-- Main Game Area -->
    <div class="flex flex-col items-center gap-8 w-full max-w-2xl">
        
        <!-- Image Display -->
        <div id="emoji-display" class="text-[10rem] drop-shadow-xl transition-all duration-300 hover:scale-110 cursor-default">
            🐱
        </div>

        <!-- Word Slots -->
        <div id="slots-container" class="flex gap-3 justify-center min-h-[90px]">
            <!-- Slots will be generated here -->
        </div>

        <!-- Letter Tray -->
        <div class="bg-white/60 p-6 rounded-3xl border-2 border-rose-200 w-full">
            <div id="tray" class="flex flex-wrap justify-center gap-4 min-h-[80px]">
                <!-- Scrambled letters will be here -->
            </div>
        </div>

        <div class="flex gap-4 mt-4">
            <button onclick="resetCurrentLevel()" class="px-8 py-3 bg-rose-200 hover:bg-rose-300 text-rose-800 font-bold rounded-xl transition-all active:scale-95">
                Reset Word
            </button>
            <button onclick="nextLevel()" id="skip-btn" class="px-8 py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl shadow-lg transition-all active:scale-95">
                Skip Word
            </button>
        </div>
    </div>

    <div id="victory-modal">
        <div class="bg-white p-12 rounded-[50px] text-center shadow-2xl max-w-sm border-8 border-rose-300">
            <div class="text-8xl mb-6">✨</div>
            <h2 class="text-4xl font-black text-rose-800 mb-4">SPELL-TACULAR!</h2>
            <p class="text-lg text-gray-600 mb-8">You got it right! You're a word wizard.</p>
            <button onclick="nextLevel(); closeModal();" class="w-full bg-rose-600 hover:bg-rose-700 text-white py-5 rounded-3xl font-bold text-2xl shadow-xl transition-all active:scale-95">Next Word</button>
        </div>
    </div>

    <script>
        const levels = [
            { word: "CAT", emoji: "🐱" },
            { word: "DOG", emoji: "🐶" },
            { word: "SUN", emoji: "☀️" },
            { word: "FISH", emoji: "🐠" },
            { word: "TREE", emoji: "🌳" },
            { word: "BOOK", emoji: "📚" },
            { word: "MOON", emoji: "🌙" },
            { word: "BIRD", emoji: "🐦" },
            { word: "APPLE", emoji: "🍎" },
            { word: "CAR", emoji: "🚗" },
            { word: "STAR", emoji: "⭐" },
            { word: "DUCK", emoji: "🦆" },
            { word: "TIGER", emoji: "🐯" },
            { word: "HOUSE", emoji: "🏠" },
            { word: "PIZZA", emoji: "🍕" },
            { word: "ROBOT", emoji: "🤖" },
            { word: "PLANE", emoji: "✈️" },
            { word: "HEART", emoji: "❤️" },
            { word: "ROCKET", emoji: "🚀" },
            { word: "BANANA", emoji: "🍌" },
            { word: "MONKEY", emoji: "🐒" },
            { word: "PENCIL", emoji: "✏️" },
            { word: "FLOWER", emoji: "🌸" },
            { word: "TURTLE", emoji: "🐢" }
        ];

        let currentLevelIndex = 0;
        let draggedTile = null;
        let sourceContainer = null;

        const emojiDisplay = document.getElementById('emoji-display');
        const slotsContainer = document.getElementById('slots-container');
        const tray = document.getElementById('tray');

        function initGame() {
            loadLevel(currentLevelIndex);
        }

        function loadLevel(index) {
            const level = levels[index];
            emojiDisplay.textContent = level.emoji;
            emojiDisplay.classList.remove('bounce');
            
            // Clear containers
            slotsContainer.innerHTML = '';
            tray.innerHTML = '';

            // Create Slots
            for (let i = 0; i < level.word.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'letter-slot';
                slot.dataset.index = i;
                setupDropZone(slot);
                slotsContainer.appendChild(slot);
            }

            // Create Letters (Scrambled)
            const letters = level.word.split('').sort(() => Math.random() - 0.5);
            letters.forEach(char => {
                const tile = createTile(char);
                tray.appendChild(tile);
            });

            setupDropZone(tray);
        }

        function createTile(char) {
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.textContent = char;
            tile.draggable = true;
            
            tile.addEventListener('dragstart', handleDragStart);
            tile.addEventListener('touchstart', handleTouchStart, {passive: false});
            
            return tile;
        }

        function setupDropZone(element) {
            element.addEventListener('dragover', e => e.preventDefault());
            element.addEventListener('drop', handleDrop);
        }

        // Drag & Drop Handlers
        function handleDragStart(e) {
            draggedTile = e.target;
            sourceContainer = draggedTile.parentElement;
        }

        function handleDrop(e) {
            e.preventDefault();
            const target = e.target.closest('.letter-slot') || e.target.closest('#tray');
            
            if (!target) return;

            // Logic for moving tiles
            if (target.id === 'tray') {
                target.appendChild(draggedTile);
            } else if (target.classList.contains('letter-slot')) {
                if (target.children.length === 0) {
                    target.appendChild(draggedTile);
                } else {
                    // Swap if slot occupied
                    const existingTile = target.children[0];
                    if (sourceContainer) sourceContainer.appendChild(existingTile);
                    target.appendChild(draggedTile);
                }
            }
            
            playClickSound();
            checkWin();
        }

        // Touch Handlers
        function handleTouchStart(e) {
            e.preventDefault();
            draggedTile = e.target;
            sourceContainer = draggedTile.parentElement;
            
            draggedTile.style.position = 'fixed';
            draggedTile.style.zIndex = '1000';
            
            window.addEventListener('touchmove', handleTouchMove, {passive: false});
            window.addEventListener('touchend', handleTouchEnd);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            draggedTile.style.left = (touch.clientX - 35) + 'px';
            draggedTile.style.top = (touch.clientY - 35) + 'px';
        }

        function handleTouchEnd(e) {
            const touch = e.changedTouches[0];
            draggedTile.style.position = '';
            draggedTile.style.zIndex = '';
            draggedTile.style.left = '';
            draggedTile.style.top = '';
            
            window.removeEventListener('touchmove', handleTouchMove);
            window.removeEventListener('touchend', handleTouchEnd);

            const elementUnder = document.elementFromPoint(touch.clientX, touch.clientY);
            const target = elementUnder?.closest('.letter-slot') || elementUnder?.closest('#tray');

            if (target) {
                if (target.id === 'tray') {
                    target.appendChild(draggedTile);
                } else if (target.classList.contains('letter-slot')) {
                    if (target.children.length === 0) {
                        target.appendChild(draggedTile);
                    } else {
                        // Swap logic for touch
                        const existingTile = target.children[0];
                        sourceContainer.appendChild(existingTile);
                        target.appendChild(draggedTile);
                    }
                }
            } else {
                // Return to source if dropped nowhere
                sourceContainer.appendChild(draggedTile);
            }
            
            playClickSound();
            checkWin();
        }

        function checkWin() {
            const currentWord = Array.from(slotsContainer.children)
                .map(slot => slot.children[0] ? slot.children[0].textContent : '')
                .join('');
            
            if (currentWord === levels[currentLevelIndex].word) {
                playWinSound();
                emojiDisplay.classList.add('bounce');
                setTimeout(() => {
                    document.getElementById('victory-modal').style.display = 'flex';
                }, 500);
            }
        }

        function closeModal() {
            document.getElementById('victory-modal').style.display = 'none';
        }

        function nextLevel() {
            currentLevelIndex = (currentLevelIndex + 1) % levels.length;
            loadLevel(currentLevelIndex);
        }

        function resetCurrentLevel() {
            loadLevel(currentLevelIndex);
        }

        function playClickSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        function playWinSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.6);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.6);
            } catch (e) {}
        }

        initGame();
    </script>
</body>
</html>
