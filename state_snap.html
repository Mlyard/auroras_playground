<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seamless US Map Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #cbd5e1;
            overflow: hidden;
            touch-action: none;
            margin: 0;
        }
        #home-link {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-weight: bold;
            z-index: 1000;
        }
        .state-piece {
            cursor: grab;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
        }
        .state-piece:active {
            cursor: grabbing;
        }
        .state-label {
            pointer-events: none;
            font-size: 11px;
            font-weight: 700;
            text-anchor: middle;
            fill: white;
            paint-order: stroke;
            stroke: black;
            stroke-width: 2.5px;
            stroke-linecap: round;
        }
        .guide-label {
            pointer-events: none;
            font-size: 10px;
            fill: #94a3b8;
            text-anchor: middle;
            font-weight: bold;
            opacity: 0.6;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #map-svg {
            width: 100%;
            height: 100%;
        }
        #victory-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .tray-bg {
            fill: #e2e8f0;
            stroke: #94a3b8;
            stroke-width: 2;
            stroke-dasharray: 8,8;
        }
    </style>
</head>
<body>

    <a href="https://mlyard.github.io/auroras_playground/home.html" id="home-link">🏠 Home</a>

    <div class="fixed top-6 right-6 bg-white p-4 rounded-2xl shadow-2xl border-b-4 border-blue-500 z-50">
        <h1 class="text-xl font-bold text-gray-800">USA Map Puzzle</h1>
        <p class="text-sm text-gray-500">Solved: <span id="counter" class="font-bold text-blue-600 text-lg">0</span> / 50</p>
    </div>

    <div id="game-container">
        <svg id="map-svg" viewBox="-300 0 1600 700" preserveAspectRatio="xMidYMid meet">
            <rect x="-300" y="0" width="1600" height="700" fill="#f8fafc" />
            
            <rect x="-280" y="20" width="230" height="660" class="tray-bg" rx="15" />
            <text x="-165" y="45" class="guide-label" style="opacity: 1; fill: #64748b; font-size: 14px;">LEFT TRAY</text>
            
            <rect x="1050" y="20" width="230" height="660" class="tray-bg" rx="15" />
            <text x="1165" y="45" class="guide-label" style="opacity: 1; fill: #64748b; font-size: 14px;">RIGHT TRAY</text>

            <g id="guide-layer"></g>
            <g id="guide-labels-layer"></g>
            <g id="placed-layer"></g>
            <g id="pieces-layer"></g>
        </svg>
    </div>

    <div id="victory-modal">
        <div class="bg-white p-12 rounded-[50px] text-center shadow-2xl max-w-md mx-4 border-[12px] border-blue-100">
            <div class="text-9xl mb-6">🇺🇸</div>
            <h2 class="text-5xl font-black text-blue-600 mb-4">WINNER!</h2>
            <p class="text-xl text-gray-600 mb-8 font-medium">You connected the whole country!</p>
            <button onclick="location.reload()" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-8 py-5 rounded-3xl font-bold text-2xl shadow-xl transition-all transform hover:scale-105 active:scale-95">Play Again</button>
        </div>
    </div>

    <script>
        const statesData = [
            { id: "WA", name: "Washington", path: "M20,20 L150,20 L150,100 L20,100 Z", cx: 85, cy: 60 },
            { id: "ID", name: "Idaho", path: "M150,20 L220,20 L220,80 L250,110 L250,250 L180,250 L180,100 L150,100 Z", cx: 200, cy: 135 },
            { id: "MT", name: "Montana", path: "M220,20 L420,20 L420,120 L220,120 Z", cx: 320, cy: 70 },
            { id: "ND", name: "North Dakota", path: "M420,20 L570,20 L570,100 L420,100 Z", cx: 495, cy: 60 },
            { id: "MN", name: "Minnesota", path: "M570,20 L700,20 L700,160 L570,160 Z", cx: 635, cy: 90 },
            { id: "WI", name: "Wisconsin", path: "M700,20 L800,20 L800,160 L700,160 Z", cx: 750, cy: 90 },
            { id: "MI", name: "Michigan", path: "M800,20 L920,20 L920,180 L800,180 L800,120 Z", cx: 860, cy: 100 },
            { id: "OR", name: "Oregon", path: "M20,100 L180,100 L180,220 L20,220 Z", cx: 100, cy: 160 },
            { id: "WY", name: "Wyoming", path: "M250,120 L420,120 L420,230 L250,230 Z", cx: 335, cy: 175 },
            { id: "SD", name: "South Dakota", path: "M420,100 L570,100 L570,180 L420,180 Z", cx: 495, cy: 140 },
            { id: "IA", name: "Iowa", path: "M570,160 L720,160 L720,260 L570,260 Z", cx: 645, cy: 210 },
            { id: "IL", name: "Illinois", path: "M720,160 L820,160 L820,340 L720,340 Z", cx: 770, cy: 250 },
            { id: "IN", name: "Indiana", path: "M820,180 L900,180 L900,340 L820,340 Z", cx: 860, cy: 260 },
            { id: "OH", name: "Ohio", path: "M900,180 L1000,180 L1000,300 L900,300 Z", cx: 950, cy: 240 },
            { id: "CA", name: "California", path: "M20,220 L150,220 L150,350 L200,400 L200,550 L120,550 L20,350 Z", cx: 85, cy: 385 },
            { id: "NV", name: "Nevada", path: "M150,220 L250,220 L250,400 L200,400 L150,350 Z", cx: 200, cy: 310 },
            { id: "UT", name: "Utah", path: "M250,230 L350,230 L350,380 L250,380 Z", cx: 300, cy: 305 },
            { id: "CO", name: "Colorado", path: "M350,230 L480,230 L480,380 L350,380 Z", cx: 415, cy: 305 },
            { id: "NE", name: "Nebraska", path: "M420,180 L570,180 L570,280 L420,230 Z", cx: 495, cy: 230 },
            { id: "KS", name: "Kansas", path: "M480,280 L570,280 L570,380 L480,380 Z", cx: 525, cy: 330 },
            { id: "MO", name: "Missouri", path: "M570,260 L720,260 L720,380 L570,380 Z", cx: 645, cy: 320 },
            { id: "KY", name: "Kentucky", path: "M720,340 L850,340 L850,420 L720,420 Z", cx: 785, cy: 380 },
            { id: "WV", name: "West Virginia", path: "M850,300 L950,300 L950,380 L850,380 Z", cx: 900, cy: 340 },
            { id: "PA", name: "Pennsylvania", path: "M920,120 L1000,120 L1000,180 L900,180 L900,120 Z", cx: 950, cy: 150 },
            { id: "AZ", name: "Arizona", path: "M200,400 L300,400 L300,550 L200,550 Z", cx: 250, cy: 475 },
            { id: "NM", name: "New Mexico", path: "M300,380 L430,380 L430,550 L300,550 L300,400 Z", cx: 365, cy: 465 },
            { id: "OK", name: "Oklahoma", path: "M430,380 L570,380 L570,480 L400,480 L400,430 L430,430 Z", cx: 485, cy: 430 },
            { id: "AR", name: "Arkansas", path: "M570,380 L700,380 L700,480 L570,480 Z", cx: 635, cy: 430 },
            { id: "TN", name: "Tennessee", path: "M700,380 L850,380 L850,450 L700,450 Z", cx: 775, cy: 415 },
            { id: "VA", name: "Virginia", path: "M850,380 L1000,380 L1000,450 L850,450 Z", cx: 925, cy: 415 },
            { id: "NY", name: "New York", path: "M920,40 L1000,40 L1000,120 L920,120 Z", cx: 960, cy: 80 },
            { id: "TX", name: "Texas", path: "M350,550 L450,550 L570,550 L600,650 L500,680 L350,680 Z", cx: 460, cy: 615 },
            { id: "LA", name: "Louisiana", path: "M570,480 L680,480 L680,580 L570,580 Z", cx: 625, cy: 530 },
            { id: "MS", name: "Mississippi", path: "M680,450 L750,450 L750,580 L680,580 Z", cx: 715, cy: 515 },
            { id: "AL", name: "Alabama", path: "M750,450 L830,450 L830,580 L750,580 Z", cx: 790, cy: 515 },
            { id: "GA", name: "Georgia", path: "M830,450 L910,450 L910,580 L830,580 Z", cx: 870, cy: 515 },
            { id: "SC", name: "South Carolina", path: "M910,450 L1000,450 L1000,520 L910,520 Z", cx: 955, cy: 485 },
            { id: "NC", name: "North Carolina", path: "M850,450 L1000,450 L1000,510 L850,510 Z", cx: 925, cy: 480 },
            { id: "FL", name: "Florida", path: "M830,580 L950,580 L1000,680 L900,680 Z", cx: 915, cy: 630 },
            { id: "ME", name: "Maine", path: "M1000,20 L1080,20 L1080,100 L1000,100 Z", cx: 1040, cy: 60 },
            { id: "VT", name: "Vermont", path: "M1000,100 L1040,100 L1040,160 L1000,160 Z", cx: 1020, cy: 130 },
            { id: "NH", name: "New Hampshire", path: "M1040,100 L1080,100 L1080,160 L1040,160 Z", cx: 1060, cy: 130 },
            { id: "MA", name: "Massachusetts", path: "M1000,160 L1080,160 L1080,200 L1000,200 Z", cx: 1040, cy: 180 },
            { id: "CT", name: "Connecticut", path: "M1000,200 L1060,200 L1060,240 L1000,240 Z", cx: 1030, cy: 220 },
            { id: "RI", name: "Rhode Island", path: "M1060,200 L1080,200 L1080,240 L1060,240 Z", cx: 1070, cy: 220 },
            { id: "NJ", name: "New Jersey", path: "M1000,240 L1060,240 L1060,300 L1000,300 Z", cx: 1030, cy: 270 },
            { id: "MD", name: "Maryland", path: "M1000,300 L1060,300 L1060,340 L1000,340 Z", cx: 1030, cy: 320 },
            { id: "DE", name: "Delaware", path: "M1000,340 L1060,340 L1060,380 L1000,380 Z", cx: 1030, cy: 360 },
            { id: "AK", name: "Alaska", path: "M20,580 L150,580 L150,680 L20,680 Z", cx: 85, cy: 630 },
            { id: "HI", name: "Hawaii", path: "M170,620 L270,620 L270,680 L170,680 Z", cx: 220, cy: 650 }
        ];

        const svg = document.getElementById('map-svg');
        const guideLayer = document.getElementById('guide-layer');
        const guideLabelsLayer = document.getElementById('guide-labels-layer');
        const placedLayer = document.getElementById('placed-layer');
        const piecesLayer = document.getElementById('pieces-layer');
        const counter = document.getElementById('counter');
        const victoryModal = document.getElementById('victory-modal');

        let solvedCount = 0;
        let activePiece = null;
        let offset = { x: 0, y: 0 };

        function init() {
            statesData.forEach((state, index) => {
                const guide = document.createElementNS("http://www.w3.org/2000/svg", "path");
                guide.setAttribute("d", state.path);
                guide.setAttribute("fill", "#cbd5e1");
                guide.setAttribute("stroke", "white");
                guide.setAttribute("stroke-width", "2");
                guide.setAttribute("opacity", "0.3");
                guideLayer.appendChild(guide);

                const gLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
                gLabel.setAttribute("x", state.cx);
                gLabel.setAttribute("y", state.cy);
                gLabel.setAttribute("class", "guide-label");
                gLabel.textContent = state.id;
                guideLabelsLayer.appendChild(gLabel);

                const piece = document.createElementNS("http://www.w3.org/2000/svg", "g");
                piece.setAttribute("class", "state-piece");
                piece.dataset.id = state.id;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", state.path);
                const colors = ['#f87171', '#fb923c', '#fbbf24', '#a3e635', '#22d3ee', '#818cf8', '#f472b6', '#2dd4bf'];
                path.setAttribute("fill", colors[index % colors.length]);
                path.setAttribute("stroke", "rgba(0,0,0,0.2)");
                path.setAttribute("stroke-width", "1");

                const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
                label.setAttribute("x", state.cx);
                label.setAttribute("y", state.cy);
                label.setAttribute("class", "state-label");
                label.textContent = state.name; // Full name used here

                piece.appendChild(path);
                piece.appendChild(label);

                // Initial Placement Logic
                let targetTrayCenterX, targetTrayY;
                const itemsPerTray = 25;
                const trayRowIndex = Math.floor((index % itemsPerTray) / 2); 
                const trayColIndex = index % 2;

                if (index < itemsPerTray) {
                    targetTrayCenterX = -215 + (trayColIndex * 100);
                    targetTrayY = 80 + (trayRowIndex * 45);
                } else {
                    targetTrayCenterX = 1065 + (trayColIndex * 100);
                    targetTrayY = 80 + (trayRowIndex * 45);
                }

                const initialTranslateX = targetTrayCenterX - state.cx;
                const initialTranslateY = targetTrayY - state.cy;

                piece.setAttribute("transform", `translate(${initialTranslateX}, ${initialTranslateY})`);
                
                piece.addEventListener('mousedown', startDrag);
                piece.addEventListener('touchstart', startDrag, {passive: false});

                piecesLayer.appendChild(piece);
            });
        }

        function startDrag(e) {
            e.preventDefault();
            activePiece = e.currentTarget;
            const pt = getSVGPoint(e);
            
            const transform = activePiece.getAttribute("transform");
            const match = /translate\(([^,]+),?\s*([^)]+)\)/.exec(transform);
            const currentX = match ? parseFloat(match[1]) : 0;
            const currentY = match ? parseFloat(match[2]) : 0;

            offset.x = pt.x - currentX;
            offset.y = pt.y - currentY;

            piecesLayer.appendChild(activePiece);
            activePiece.style.opacity = "0.8";
            
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, {passive: false});
            window.addEventListener('mouseup', stopDrag);
            window.addEventListener('touchend', stopDrag);
        }

        function drag(e) {
            if (!activePiece) return;
            const pt = getSVGPoint(e);
            activePiece.setAttribute("transform", `translate(${pt.x - offset.x}, ${pt.y - offset.y})`);
        }

        function stopDrag() {
            if (!activePiece) return;
            activePiece.style.opacity = "1";

            const transform = activePiece.getAttribute("transform");
            const match = /translate\(([^,]+),?\s*([^)]+)\)/.exec(transform);
            const x = match ? parseFloat(match[1]) : 0;
            const y = match ? parseFloat(match[2]) : 0;

            if (Math.abs(x) < 40 && Math.abs(y) < 40) {
                activePiece.setAttribute("transform", "translate(0,0)");
                activePiece.removeEventListener('mousedown', startDrag);
                activePiece.removeEventListener('touchstart', startDrag);
                activePiece.style.cursor = "default";
                activePiece.querySelector('path').setAttribute('stroke', 'rgba(255,255,255,0.5)');
                
                placedLayer.appendChild(activePiece);
                solvedCount++;
                counter.textContent = solvedCount;
                playSnapSound();

                if (solvedCount === statesData.length) {
                    victoryModal.style.display = "flex";
                }
            }

            activePiece = null;
            window.removeEventListener('mousemove', drag);
            window.removeEventListener('touchmove', drag);
            window.removeEventListener('mouseup', stopDrag);
            window.removeEventListener('touchend', stopDrag);
        }

        function getSVGPoint(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const p = svg.createSVGPoint();
            p.x = clientX;
            p.y = clientY;
            const CTM = svg.getScreenCTM();
            return p.matrixTransform(CTM.inverse());
        }

        function playSnapSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        init();
    </script>
</body>
</html>
