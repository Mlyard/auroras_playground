<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Link - Laurel Ridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #f8fafc;
            overflow-x: hidden;
            touch-action: none;
        }
        #home-link {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            color: #1e293b;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 100;
        }
        .grid-cell {
            width: 60px;
            height: 60px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: white;
            transition: background 0.3s;
        }
        .grid-cell.wall { background-color: #475569; }
        .grid-cell.goal { background-color: #fef08a; }
        .grid-cell.active { background-color: #dcfce7; }
        
        .command-card {
            width: 50px;
            height: 50px;
            background: #3b82f6;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #2563eb;
            transition: transform 0.1s;
        }
        .command-card:active { transform: translateY(2px); box-shadow: 0 2px 0 #2563eb; }
        
        #victory-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
    </style>
</head>
<body class="flex flex-col items-center p-4 min-h-screen">

    <a href="https://mlyard.github.io/auroras_playground/home.html" id="home-link">🏠 Home</a>

    <div class="text-center mt-16 mb-8">
        <h1 class="text-4xl font-bold text-blue-800 mb-2">Logic Link</h1>
        <p class="text-blue-600">Give the robot 🤖 commands to reach the battery 🔋!</p>
    </div>

    <div class="flex flex-col md:flex-row gap-12 items-start justify-center w-full max-w-5xl">
        
        <!-- Game Grid -->
        <div class="bg-white p-4 rounded-3xl shadow-xl border-4 border-blue-100">
            <div id="grid" class="grid grid-cols-6 grid-rows-6 gap-1">
                <!-- Grid items generated by JS -->
            </div>
        </div>

        <!-- Controls -->
        <div class="flex flex-col gap-6 w-full md:w-80">
            <div class="bg-blue-50 p-6 rounded-3xl border-2 border-blue-100">
                <h2 class="font-bold text-blue-800 mb-4 uppercase tracking-wider text-sm text-center">Available Commands</h2>
                <div class="flex justify-center gap-3">
                    <div onclick="addCommand('up')" class="command-card">⬆️</div>
                    <div onclick="addCommand('down')" class="command-card">⬇️</div>
                    <div onclick="addCommand('left')" class="command-card">⬅️</div>
                    <div onclick="addCommand('right')" class="command-card">➡️</div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-lg border-2 border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-gray-700">Sequence</h2>
                    <button onclick="clearSequence()" class="text-xs text-red-500 font-bold hover:underline">CLEAR</button>
                </div>
                <div id="sequence-container" class="flex flex-wrap gap-2 min-h-[110px]">
                    <!-- Commands go here -->
                </div>
                <button id="run-btn" onclick="runSequence()" class="w-full mt-6 bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-95">
                    RUN COMMANDS!
                </button>
            </div>
        </div>
    </div>

    <div id="victory-modal">
        <div class="bg-white p-12 rounded-[50px] text-center shadow-2xl max-w-sm border-8 border-yellow-200">
            <div class="text-8xl mb-6">⚡</div>
            <h2 class="text-4xl font-black text-gray-800 mb-4">POWERED UP!</h2>
            <p class="text-lg text-gray-600 mb-8">Great coding! The robot reached the goal.</p>
            <button onclick="nextLevel()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-5 rounded-3xl font-bold text-2xl shadow-xl transition-all active:scale-95">Next Mission</button>
        </div>
    </div>

    <script>
        const GRID_SIZE = 6;
        let robotPos = { x: 0, y: 0 };
        let goalPos = { x: 5, y: 5 };
        let walls = [];
        let sequence = [];
        let isRunning = false;

        const gridEl = document.getElementById('grid');
        const sequenceContainer = document.getElementById('sequence-container');

        const levels = [
            { walls: [] },
            { walls: [{x:2, y:0}, {x:2, y:1}, {x:2, y:2}] },
            { walls: [{x:3, y:5}, {x:3, y:4}, {x:3, y:3}, {x:3, y:2}] },
            { walls: [{x:1, y:1}, {x:2, y:1}, {x:3, y:1}, {x:1, y:2}, {x:1, y:3}] }
        ];
        let currentLevel = 0;

        function getRandomPos(excludeList = []) {
            let pos;
            let isValid = false;
            while (!isValid) {
                pos = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                isValid = !excludeList.some(p => p.x === pos.x && p.y === pos.y);
            }
            return pos;
        }

        // Logic to find a position as far as possible from a reference point
        function getFarGoalPos(referencePos, walls) {
            let potentialSpots = [];
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    // Check if spot is wall or current robot pos
                    const isWall = walls.some(w => w.x === x && w.y === y);
                    const isRobot = referencePos.x === x && referencePos.y === y;
                    
                    if (!isWall && !isRobot) {
                        // Calculate Manhattan distance
                        const dist = Math.abs(x - referencePos.x) + Math.abs(y - referencePos.y);
                        potentialSpots.push({ x, y, dist });
                    }
                }
            }

            // Find maximum distance
            const maxDist = Math.max(...potentialSpots.map(s => s.dist));
            // Filter spots that have the maximum distance
            const furthestSpots = potentialSpots.filter(s => s.dist === maxDist);
            
            // Return a random spot from the furthest possible options
            return furthestSpots[Math.floor(Math.random() * furthestSpots.length)];
        }

        function initGrid() {
            gridEl.innerHTML = '';
            const level = levels[currentLevel];
            walls = level.walls;

            // 1. Pick robot position randomly
            robotPos = getRandomPos(walls);
            
            // 2. Pick goal position as far as possible
            goalPos = getFarGoalPos(robotPos, walls);

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.id = `cell-${x}-${y}`;
                    
                    if (x === goalPos.x && y === goalPos.y) {
                        cell.textContent = '🔋';
                        cell.classList.add('goal');
                    }
                    if (walls.some(w => w.x === x && w.y === y)) {
                        cell.classList.add('wall');
                    }
                    if (x === robotPos.x && y === robotPos.y) {
                        cell.textContent = '🤖';
                        cell.classList.add('active');
                    }
                    
                    gridEl.appendChild(cell);
                }
            }
        }

        function addCommand(dir) {
            if (isRunning || sequence.length >= 12) return;
            sequence.push(dir);
            renderSequence();
        }

        function renderSequence() {
            sequenceContainer.innerHTML = '';
            sequence.forEach((dir, index) => {
                const cmd = document.createElement('div');
                cmd.className = 'command-card w-10 h-10 text-sm';
                cmd.textContent = dir === 'up' ? '⬆️' : dir === 'down' ? '⬇️' : dir === 'left' ? '⬅️' : '➡️';
                cmd.onclick = () => {
                    sequence.splice(index, 1);
                    renderSequence();
                };
                sequenceContainer.appendChild(cmd);
            });
        }

        function clearSequence() {
            if (isRunning) return;
            sequence = [];
            renderSequence();
        }

        async function runSequence() {
            if (isRunning || sequence.length === 0) return;
            isRunning = true;
            document.getElementById('run-btn').disabled = true;
            document.getElementById('run-btn').classList.add('opacity-50');

            const currentMovingPos = { ...robotPos };

            for (let dir of sequence) {
                const oldCell = document.getElementById(`cell-${currentMovingPos.x}-${currentMovingPos.y}`);
                if (oldCell) {
                    oldCell.textContent = '';
                    oldCell.classList.remove('active');
                }

                if (dir === 'up') currentMovingPos.y--;
                if (dir === 'down') currentMovingPos.y++;
                if (dir === 'left') currentMovingPos.x--;
                if (dir === 'right') currentMovingPos.x++;

                if (currentMovingPos.x < 0 || currentMovingPos.x >= GRID_SIZE || 
                    currentMovingPos.y < 0 || currentMovingPos.y >= GRID_SIZE || 
                    walls.some(w => w.x === currentMovingPos.x && w.y === currentMovingPos.y)) {
                    
                    playTone(200, 100);
                    alertMessage("The robot hit a wall or went out of bounds!");
                    setTimeout(() => resetRobot(), 1000);
                    return;
                }

                const newCell = document.getElementById(`cell-${currentMovingPos.x}-${currentMovingPos.y}`);
                if (newCell) {
                    newCell.textContent = '🤖';
                    newCell.classList.add('active');
                }
                
                playTone(400, 600);
                await new Promise(r => setTimeout(r, 400));

                if (currentMovingPos.x === goalPos.x && currentMovingPos.y === goalPos.y) {
                    showVictory();
                    return;
                }
            }

            alertMessage("Out of commands! Try a longer sequence.");
            setTimeout(() => resetRobot(), 1000);
        }

        function resetRobot() {
            isRunning = false;
            document.getElementById('run-btn').disabled = false;
            document.getElementById('run-btn').classList.remove('opacity-50');
            
            // Re-draw current state positions
            const level = levels[currentLevel];
            gridEl.innerHTML = '';
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.id = `cell-${x}-${y}`;
                    if (x === goalPos.x && y === goalPos.y) {
                        cell.textContent = '🔋';
                        cell.classList.add('goal');
                    }
                    if (walls.some(w => w.x === x && w.y === y)) cell.classList.add('wall');
                    if (x === robotPos.x && y === robotPos.y) {
                        cell.textContent = '🤖';
                        cell.classList.add('active');
                    }
                    gridEl.appendChild(cell);
                }
            }
        }

        function showVictory() {
            playTone(600, 900);
            document.getElementById('victory-modal').style.display = 'flex';
        }

        function nextLevel() {
            currentLevel = (currentLevel + 1) % levels.length;
            document.getElementById('victory-modal').style.display = 'none';
            sequence = [];
            renderSequence();
            isRunning = false;
            document.getElementById('run-btn').disabled = false;
            document.getElementById('run-btn').classList.remove('opacity-50');
            initGrid();
        }

        function resetGame() {
            sequence = [];
            renderSequence();
            isRunning = false;
            document.getElementById('run-btn').disabled = false;
            document.getElementById('run-btn').classList.remove('opacity-50');
            initGrid();
        }

        function alertMessage(msg) {
            const p = document.querySelector('p.text-blue-600');
            const original = p.textContent;
            p.textContent = msg;
            p.className = "text-red-500 font-bold";
            setTimeout(() => {
                if (p.textContent === msg) {
                    p.textContent = original;
                    p.className = "text-blue-600";
                }
            }, 3000);
        }

        function playTone(f1, f2) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(f1, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(f2, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        initGrid();
    </script>
</body>
</html>
