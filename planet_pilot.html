<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet Pilot - Laurel Ridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            color: white;
            overflow: hidden;
            touch-action: none;
        }
        #home-link {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .planet-slot {
            width: 100px;
            height: 100px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }
        .planet-slot::after {
            content: attr(data-index);
            position: absolute;
            bottom: -25px;
            font-size: 0.8rem;
            opacity: 0.5;
        }
        .planet {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.7rem;
            text-align: center;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            z-index: 50;
            user-select: none;
        }
        .planet:active { cursor: grabbing; transform: scale(1.1); }
        .sun {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #fff700 0%, #ff9500 70%, #ff4500 100%);
            border-radius: 50%;
            box-shadow: 0 0 80px #ff9500;
            position: absolute;
            left: -90px;
            top: 50%;
            transform: translateY(-50%);
        }
        #victory-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        #orbit-container::-webkit-scrollbar {
            height: 6px;
        }
        #orbit-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">

    <a href="https://mlyard.github.io/auroras_playground/home.html" id="home-link">🏠 Home</a>

    <div class="sun"></div>

    <div class="text-center mb-4 ml-24 px-4">
        <h1 class="text-4xl font-bold mb-2">Planet Pilot</h1>
        <p class="text-blue-300">Drag the planets into their correct order from the Sun!</p>
        <div id="status-msg" class="h-8 mt-2 text-lg font-bold"></div>
    </div>

    <!-- Orbit Slots -->
    <div id="orbit-container" class="flex items-center gap-4 md:gap-8 ml-32 md:ml-48 overflow-x-auto pb-12 pt-4 px-12 w-full max-w-full">
        <div class="planet-slot" data-index="1"></div>
        <div class="planet-slot" data-index="2"></div>
        <div class="planet-slot" data-index="3"></div>
        <div class="planet-slot" data-index="4"></div>
        <div class="planet-slot" data-index="5"></div>
        <div class="planet-slot" data-index="6"></div>
        <div class="planet-slot" data-index="7"></div>
        <div class="planet-slot" data-index="8"></div>
    </div>

    <!-- Planet Tray (Staging Area) -->
    <div id="tray-container" class="mt-4 flex flex-col items-center w-full max-w-4xl px-4">
        <div id="tray" class="p-6 bg-white/5 backdrop-blur-md rounded-3xl border border-white/10 flex flex-wrap justify-center gap-4 md:gap-6 w-full min-h-[120px]">
            <!-- Planets will be shuffled here -->
        </div>
        <button onclick="resetGame()" class="mt-6 px-8 py-3 bg-red-500/20 hover:bg-red-500/40 border border-red-500/50 rounded-xl font-bold text-red-200 transition-all active:scale-95">
            Reset Mission
        </button>
    </div>

    <div id="victory-modal">
        <div class="bg-indigo-900 border-2 border-indigo-400 p-10 rounded-3xl text-center shadow-2xl max-w-md">
            <div class="text-7xl mb-4">🚀</div>
            <h2 class="text-3xl font-bold text-white mb-2">System Cleared!</h2>
            <p class="text-indigo-200 mb-6">You've successfully mapped the Solar System, Captain!</p>
            <button onclick="location.reload()" class="bg-indigo-500 hover:bg-indigo-400 text-white px-8 py-3 rounded-xl font-bold transition">New Mission</button>
        </div>
    </div>

    <script>
        const planetsData = [
            { name: "Mercury", color: "#A5A5A5", size: 40, order: 1 },
            { name: "Venus", color: "#E3BB76", size: 60, order: 2 },
            { name: "Earth", color: "#2271B3", size: 65, order: 3 },
            { name: "Mars", color: "#E27B58", size: 50, order: 4 },
            { name: "Jupiter", color: "#D39C7E", size: 95, order: 5 },
            { name: "Saturn", color: "#C5AB6E", size: 85, order: 6 },
            { name: "Uranus", color: "#BBE1E4", size: 75, order: 7 },
            { name: "Neptune", color: "#6081FF", size: 75, order: 8 }
        ];

        const tray = document.getElementById('tray');
        const slots = document.querySelectorAll('.planet-slot');
        const statusMsg = document.getElementById('status-msg');
        let draggedPlanet = null;

        function init() {
            tray.innerHTML = '';
            const shuffled = [...planetsData].sort(() => Math.random() - 0.5);
            shuffled.forEach(p => {
                const el = document.createElement('div');
                el.className = 'planet';
                el.draggable = true;
                el.style.backgroundColor = p.color;
                el.style.width = p.size + 'px';
                el.style.height = p.size + 'px';
                el.textContent = p.name;
                el.dataset.order = p.order;

                el.addEventListener('dragstart', () => { draggedPlanet = el; });
                el.addEventListener('touchstart', handleTouchStart, {passive: false});
                
                tray.appendChild(el);
            });

            // Desktop Drag & Drop logic for slots
            slots.forEach(slot => {
                slot.addEventListener('dragover', e => e.preventDefault());
                slot.addEventListener('drop', e => {
                    if (slot.children.length === 0) {
                        slot.appendChild(draggedPlanet);
                        checkWin();
                    }
                });
            });

            // Desktop Drag & Drop logic for tray (returning planets)
            tray.addEventListener('dragover', e => e.preventDefault());
            tray.addEventListener('drop', e => {
                tray.appendChild(draggedPlanet);
                checkWin();
            });
        }

        function handleTouchStart(e) {
            e.preventDefault();
            draggedPlanet = e.target;
            window.addEventListener('touchmove', handleTouchMove, {passive: false});
            window.addEventListener('touchend', handleTouchEnd);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            draggedPlanet.style.position = 'fixed';
            draggedPlanet.style.left = (touch.clientX - draggedPlanet.offsetWidth/2) + 'px';
            draggedPlanet.style.top = (touch.clientY - draggedPlanet.offsetHeight/2) + 'px';
            draggedPlanet.style.zIndex = '1000';
        }

        function handleTouchEnd(e) {
            const touch = e.changedTouches[0];
            draggedPlanet.style.position = '';
            draggedPlanet.style.zIndex = '50';
            window.removeEventListener('touchmove', handleTouchMove);
            window.removeEventListener('touchend', handleTouchEnd);

            const elementUnder = document.elementFromPoint(touch.clientX, touch.clientY);
            const slot = elementUnder?.closest('.planet-slot');

            if (slot && slot.children.length === 0) {
                slot.appendChild(draggedPlanet);
            } else {
                tray.appendChild(draggedPlanet);
            }
            checkWin();
        }

        function checkWin() {
            let occupied = 0;
            let correct = 0;
            
            slots.forEach((slot, i) => {
                const planet = slot.querySelector('.planet');
                if (planet) {
                    occupied++;
                    if (parseInt(planet.dataset.order) === (i + 1)) {
                        correct++;
                    }
                }
            });

            if (occupied === planetsData.length) {
                if (correct === planetsData.length) {
                    statusMsg.textContent = "Right! Perfect alignment!";
                    statusMsg.className = "h-8 mt-2 text-lg font-bold text-green-400";
                    document.getElementById('victory-modal').style.display = 'flex';
                    playWinSound();
                } else {
                    statusMsg.textContent = "Wrong! Check your order and try again.";
                    statusMsg.className = "h-8 mt-2 text-lg font-bold text-red-400 shake";
                    playErrorSound();
                    setTimeout(() => statusMsg.classList.remove('shake'), 500);
                }
            } else {
                statusMsg.textContent = "";
                statusMsg.className = "h-8 mt-2 text-lg font-bold";
            }
        }

        function resetGame() {
            slots.forEach(slot => {
                const planet = slot.querySelector('.planet');
                if (planet) tray.appendChild(planet);
            });
            statusMsg.textContent = "";
            init(); // Re-shuffle on reset
        }

        function playWinSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {}
        }

        function playErrorSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {}
        }

        init();
    </script>
</body>
</html>
