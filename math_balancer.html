<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Balance Scale</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0f7fa; /* Light blue background */
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            pointer-events: none;
        }
        
        /* Home Button Style matched from Clock Game */
        #home-link {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-weight: bold;
            z-index: 100; /* High z-index to stay above everything */
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s ease;
        }

        #home-link:hover {
            transform: scale(1.05);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #333;
        }
        p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            color: #666;
        }
        #reset-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: #ff5252;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        #reset-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Added Home Link -->
    <a href="https://mlyard.github.io/auroras_playground/home.html" id="home-link">🏠 Home</a>

    <div id="ui-layer">
        <h1>Math Balance</h1>
        <p>Drag blue weights to pegs. Make the Torque (Weight × Distance) equal!</p>
    </div>

    <button id="reset-btn" onclick="resetGame()">Reset Scale</button>

    <div id="canvas-container"></div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Global Config ---
        const PEG_COUNT = 10;
        const PEG_SPACING = 3.5; // Distance between numbers
        const BEAM_WIDTH = (PEG_COUNT * PEG_SPACING * 2) + 4;
        const BEAM_HEIGHT = 4.5; // Thicker beam
        const PEG_Y_OFFSET = -1.5; // Pegs near bottom of thicker beam
        
        // --- Three.js Globals ---
        let scene, camera, renderer;
        let beamGroup, standMesh; // Parts of the scale
        let weights = [];          // Array of all weight meshes
        let raycaster, mouse;
        let dragPlane;             // Invisible plane for dragging
        
        // --- Game State ---
        let heldWeight = null;
        let dragOffset = new THREE.Vector3();
        let scaleState = { leftTorque: 0, rightTorque: 0 };
        
        // To track what is on each peg for stacking
        let pegOccupancy = {
            left: new Array(11).fill(0), // Using 1-based index for simplicity
            right: new Array(11).fill(0)
        };

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe0f7fa);
            
            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 20, 100);
            camera.lookAt(0, 5, 0);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 2. Build the Scale
            createStand();
            createBeam();
            createWeightsSupply();

            // 3. Invisible Drag Plane
            const dragGeo = new THREE.PlaneGeometry(500, 500);
            const dragMat = new THREE.MeshBasicMaterial({ visible: false });
            dragPlane = new THREE.Mesh(dragGeo, dragMat);
            dragPlane.position.z = 2;
            scene.add(dragPlane);

            // 4. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 5. Events
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('resize', onResize);
            document.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('mouseup', onPointerUp);
            
            document.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                onPointerDown({ clientX: touch.clientX, clientY: touch.clientY });
            }, { passive: false });

            document.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                onPointerMove({ clientX: touch.clientX, clientY: touch.clientY });
            }, { passive: false });

            document.addEventListener('touchend', onPointerUp);
        }

        function createStand() {
            const material = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.4 });
            const baseGeo = new THREE.BoxGeometry(30, 2, 10);
            const base = new THREE.Mesh(baseGeo, material);
            base.position.y = -10;
            scene.add(base);

            const postGeo = new THREE.BoxGeometry(3, 22, 3);
            standMesh = new THREE.Mesh(postGeo, material);
            scene.add(standMesh);

            const pinGeo = new THREE.CylinderGeometry(0.5, 0.5, 4, 16);
            pinGeo.rotateX(Math.PI / 2);
            const pin = new THREE.Mesh(pinGeo, new THREE.MeshStandardMaterial({ color: 0xffffff }));
            pin.position.y = 8;
            scene.add(pin);
        }

        function createBeam() {
            beamGroup = new THREE.Group();
            beamGroup.position.y = 8;
            scene.add(beamGroup);

            const barGeo = new THREE.BoxGeometry(BEAM_WIDTH, BEAM_HEIGHT, 1.5);
            const barMat = new THREE.MeshStandardMaterial({ color: 0xffeb3b, roughness: 0.3 });
            const bar = new THREE.Mesh(barGeo, barMat);
            beamGroup.add(bar);

            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffeb3b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'black';
            ctx.font = 'bold 45px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const centerX = canvas.width / 2;
            const pixelsPerUnit = canvas.width / BEAM_WIDTH;
            const textY = canvas.height * 0.35;

            for (let i = 1; i <= 10; i++) {
                const rightX = centerX + (i * PEG_SPACING * pixelsPerUnit);
                ctx.fillText(i.toString(), rightX, textY);
                const leftX = centerX - (i * PEG_SPACING * pixelsPerUnit);
                ctx.fillText(i.toString(), leftX, textY);
            }

            const texture = new THREE.CanvasTexture(canvas);
            const labelGeo = new THREE.PlaneGeometry(BEAM_WIDTH, BEAM_HEIGHT);
            const labelMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
            const labelMesh = new THREE.Mesh(labelGeo, labelMat);
            labelMesh.position.z = 0.76;
            beamGroup.add(labelMesh);

            const pegGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.5, 8);
            pegGeo.rotateX(Math.PI / 2);
            const pegMat = new THREE.MeshStandardMaterial({ color: 0xfbc02d });

            for (let i = 1; i <= 10; i++) {
                const pR = new THREE.Mesh(pegGeo, pegMat);
                pR.position.set(i * PEG_SPACING, PEG_Y_OFFSET, 0.5);
                beamGroup.add(pR);

                const pL = new THREE.Mesh(pegGeo, pegMat);
                pL.position.set(-i * PEG_SPACING, PEG_Y_OFFSET, 0.5);
                beamGroup.add(pL);
            }
        }

        function createWeightsSupply() {
            const geo = new THREE.BoxGeometry(2, 4, 0.5);
            const holeGeo = new THREE.TorusGeometry(0.4, 0.1, 8, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0x0288d1 });
            const holeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

            for (let i = 0; i < 20; i++) {
                const group = new THREE.Group();
                const body = new THREE.Mesh(geo, mat);
                body.position.y = -1;
                const hole = new THREE.Mesh(holeGeo, holeMat);
                hole.position.y = 0.5;
                hole.position.z = 0.26;
                group.add(body);
                group.add(hole);

                group.userData = { 
                    isWeight: true, 
                    originalPos: new THREE.Vector3(),
                    onPeg: null 
                };

                const x = (Math.random() - 0.5) * 40;
                const y = -12 - (Math.random() * 5);
                const z = 2 + (Math.random() * 2);
                group.position.set(x, y, z);
                group.rotation.z = (Math.random() - 0.5) * 0.5;
                group.userData.originalPos.set(x, y, z);

                scene.add(group);
                weights.push(group);
            }
        }

        function onPointerDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            for (let hit of intersects) {
                let target = hit.object;
                while (target.parent && target.parent !== scene && !target.userData.isWeight) {
                    target = target.parent;
                }
                if (target.userData.isWeight) {
                    startDrag(target, hit.point);
                    return;
                }
            }
        }

        function startDrag(obj, hitPoint) {
            heldWeight = obj;
            if (obj.userData.onPeg) removeFromPeg(obj);
            if (obj.parent === beamGroup) scene.attach(obj);
            obj.rotation.set(0, 0, 0);
            dragOffset.set(0, 0, 0); 
        }

        function onPointerMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            if (!heldWeight) return;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(dragPlane);
            if (intersects.length > 0) {
                heldWeight.position.copy(intersects[0].point);
                heldWeight.position.z = 2;
            }
        }

        function onPointerUp() {
            if (!heldWeight) return;
            dropWeight(heldWeight);
            heldWeight = null;
        }

        function dropWeight(obj) {
            let closestDist = 2.5;
            let foundPeg = null;

            const checkPeg = (side, index) => {
                const localX = (side === 'right' ? 1 : -1) * index * PEG_SPACING;
                const localPos = new THREE.Vector3(localX, PEG_Y_OFFSET, 0); 
                const worldPos = localPos.clone().applyMatrix4(beamGroup.matrixWorld);
                const dist = worldPos.distanceTo(obj.position);
                if (dist < closestDist) {
                    closestDist = dist;
                    foundPeg = { side, index, localX };
                }
            };

            for (let i = 1; i <= 10; i++) {
                checkPeg('left', i);
                checkPeg('right', i);
            }

            if (foundPeg) attachToPeg(obj, foundPeg);
            else returnToSupply(obj);
        }

        function attachToPeg(obj, pegInfo) {
            obj.userData.onPeg = { side: pegInfo.side, val: pegInfo.index };
            const arr = pegInfo.side === 'left' ? pegOccupancy.left : pegOccupancy.right;
            arr[pegInfo.index]++;
            const stackCount = arr[pegInfo.index];

            beamGroup.attach(obj); 
            obj.position.set(pegInfo.localX, PEG_Y_OFFSET - 0.5, 0.5 + (stackCount * 0.6));
            obj.rotation.set(0, 0, 0);
            calculateBalance();
        }

        function removeFromPeg(obj) {
            const data = obj.userData.onPeg;
            if (!data) return;
            const arr = data.side === 'left' ? pegOccupancy.left : pegOccupancy.right;
            arr[data.val]--;
            obj.userData.onPeg = null;
            calculateBalance();
        }

        function returnToSupply(obj) {
            scene.attach(obj);
            const x = (Math.random() - 0.5) * 40;
            const y = -12 - (Math.random() * 5);
            obj.position.set(x, y, 2 + Math.random());
            obj.rotation.z = (Math.random() - 0.5) * 0.5;
        }

        function calculateBalance() {
            let leftTorque = 0;
            let rightTorque = 0;
            for(let i=1; i<=10; i++) {
                leftTorque += pegOccupancy.left[i] * i;
                rightTorque += pegOccupancy.right[i] * i;
            }
            scaleState.leftTorque = leftTorque;
            scaleState.rightTorque = rightTorque;
        }

        function animate() {
            requestAnimationFrame(animate);
            let targetRotation = 0;
            const tiltAmount = 0.35;

            if (scaleState.leftTorque > scaleState.rightTorque) targetRotation = tiltAmount; 
            else if (scaleState.rightTorque > scaleState.leftTorque) targetRotation = -tiltAmount; 
            else targetRotation = 0;

            beamGroup.rotation.z += (targetRotation - beamGroup.rotation.z) * 0.1;

            for(let w of weights) {
                if (w.parent === beamGroup) w.rotation.z = -beamGroup.rotation.z;
            }

            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.resetGame = function() {
            pegOccupancy.left.fill(0);
            pegOccupancy.right.fill(0);
            scaleState.leftTorque = 0;
            scaleState.rightTorque = 0;
            for(let w of weights) {
                if (w.parent === beamGroup) scene.attach(w);
                w.userData.onPeg = null;
                returnToSupply(w);
            }
        };
    </script>
</body>
</html>
