<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Chemist Pro - Laboratory</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background: radial-gradient(circle at top left, #f3e8ff, #e0e7ff);
            overflow: hidden; /* Prevent scroll on mobile */
            touch-action: manipulation;
        }

        /* Glassmorphism Cards */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
        }

        /* Home Button */
        #home-link {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            background: white;
            padding: 8px 16px;
            border-radius: 99px;
            color: #6b21a8;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 50;
            transition: transform 0.2s;
        }
        #home-link:active { transform: scale(0.95); }

        /* Beakers & Flasks */
        .ingredient-beaker {
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        .ingredient-beaker:active { transform: scale(0.95) translateY(2px); }
        .ingredient-beaker:hover { transform: translateY(-4px); }

        .main-flask-container {
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
        }

        .flask-body {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            clip-path: polygon(20% 0, 80% 0, 100% 100%, 0% 100%);
        }

        /* Liquid Animation */
        .liquid-surface {
            transition: height 0.5s ease-out, background-color 0.5s ease;
        }

        .bubble {
            position: absolute;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            bottom: 0;
            animation: rise 2s infinite ease-in;
            opacity: 0;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
        }

        /* Droplet Animation */
        .falling-drop {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50% 0 50% 50%;
            transform: rotate(-45deg);
            z-index: 20;
            animation: dropFall 0.5s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards;
        }

        @keyframes dropFall {
            0% { top: -40px; opacity: 1; transform: rotate(-45deg) scale(1); }
            90% { transform: rotate(-45deg) scale(0.9); opacity: 1; }
            100% { top: 70%; opacity: 0; transform: rotate(-45deg) scale(1.5); }
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: confetti-fall 3s linear forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* Recipe Dots */
        .recipe-dot {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between py-6 px-4 relative">

    <a href="https://mlyard.github.io/auroras_playground/home.html" id="home-link">🏠 Exit</a>

    <!-- Top Bar: Header & Controls -->
    <div class="w-full max-w-lg flex justify-between items-center mt-8 mb-2">
        <div>
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Color Chemist</h1>
            <div class="text-sm text-slate-500 font-medium">Level: <span id="level-indicator">1</span></div>
        </div>
        <button onclick="toggleSound()" id="sound-btn" class="p-3 bg-white rounded-full shadow-sm text-slate-400 hover:text-purple-600 transition-colors">
            🔊
        </button>
    </div>

    <!-- Instructions / Feedback Area -->
    <div class="w-full max-w-lg h-16 flex items-center justify-center">
        <p id="instruction-text" class="text-center text-slate-600 font-medium text-lg animate-pulse">
            Start mixing! Target: <span id="target-text-name" class="font-bold">...</span>
        </p>
    </div>

    <!-- Main Game Area -->
    <div class="flex-1 w-full max-w-3xl flex flex-col items-center justify-center gap-6 relative">
        
        <!-- Target vs Current Comparison -->
        <div class="glass-panel p-4 rounded-3xl flex items-center gap-6 w-full max-w-md justify-around">
            <div class="flex flex-col items-center gap-2">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Target</span>
                <div id="target-swatch" class="w-20 h-20 rounded-2xl shadow-inner border-4 border-white ring-1 ring-slate-200 transition-colors duration-500"></div>
            </div>
            
            <div class="text-slate-300 text-2xl font-light">➔</div>

            <div class="flex flex-col items-center gap-2">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Result</span>
                <div id="current-swatch" class="w-20 h-20 rounded-2xl shadow-inner border-4 border-white ring-1 ring-slate-200 bg-white transition-colors duration-300"></div>
            </div>
        </div>

        <!-- Recipe Tracker (History) -->
        <div class="h-8 flex gap-2 items-center justify-center w-full" id="recipe-track">
            <!-- Dots appear here -->
            <span class="text-slate-400 text-sm italic opacity-50" id="empty-recipe-text">Empty flask...</span>
        </div>

        <!-- The Lab Bench (Reorganized Layout) -->
        <div class="relative w-full flex justify-center items-end gap-12 h-64">
            
            <!-- Ingredients Rack (Grouped on Left) -->
            <div class="flex items-end gap-4 p-5 rounded-3xl bg-white/40 border border-white/50 shadow-sm backdrop-blur-sm">
                <!-- Ingredient: Red -->
                <div onclick="addIngredient('red')" class="ingredient-beaker flex flex-col items-center gap-2 group z-10">
                    <div class="w-16 h-24 bg-red-50 rounded-b-xl border-2 border-slate-300 border-t-0 relative overflow-hidden">
                        <div class="absolute bottom-0 w-full h-3/4 bg-red-500 opacity-90 group-hover:bg-red-400 transition-colors"></div>
                        <div class="absolute top-0 w-full h-1 bg-slate-300"></div>
                    </div>
                    <span class="font-bold text-slate-500 text-xs">RED</span>
                </div>

                <!-- Ingredient: Yellow -->
                <div onclick="addIngredient('yellow')" class="ingredient-beaker flex flex-col items-center gap-2 group z-10">
                    <div class="w-16 h-24 bg-yellow-50 rounded-b-xl border-2 border-slate-300 border-t-0 relative overflow-hidden">
                        <div class="absolute bottom-0 w-full h-3/4 bg-yellow-400 opacity-90 group-hover:bg-yellow-300 transition-colors"></div>
                        <div class="absolute top-0 w-full h-1 bg-slate-300"></div>
                    </div>
                    <span class="font-bold text-slate-500 text-xs">YELLOW</span>
                </div>

                <!-- Ingredient: Blue -->
                <div onclick="addIngredient('blue')" class="ingredient-beaker flex flex-col items-center gap-2 group z-10">
                    <div class="w-16 h-24 bg-blue-50 rounded-b-xl border-2 border-slate-300 border-t-0 relative overflow-hidden">
                        <div class="absolute bottom-0 w-full h-3/4 bg-blue-500 opacity-90 group-hover:bg-blue-400 transition-colors"></div>
                        <div class="absolute top-0 w-full h-1 bg-slate-300"></div>
                    </div>
                    <span class="font-bold text-slate-500 text-xs">BLUE</span>
                </div>
            </div>

            <!-- Main Mixing Flask (Right Side) -->
            <div class="main-flask-container relative w-32 h-44 flex flex-col items-center justify-end">
                <!-- Drop Zone -->
                <div id="drop-zone" class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-full pointer-events-none z-20"></div>
                
                <!-- Flask Shape -->
                <div class="w-full h-full relative">
                    <!-- Neck -->
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-10 h-16 bg-white/20 border-x-4 border-slate-700/80 z-10 backdrop-blur-sm"></div>
                    <!-- Rim -->
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-14 h-4 bg-slate-700 rounded-full z-20"></div>
                    
                    <!-- Body (Triangle/Coneish) -->
                    <div class="absolute bottom-0 w-full h-32 bg-white/10 border-4 border-slate-700 backdrop-blur-md rounded-b-[3rem] overflow-hidden z-10">
                        <!-- The Liquid -->
                        <div id="mix-liquid" class="liquid-surface absolute bottom-0 w-full bg-slate-100 flex justify-center" style="height: 0%;">
                            <!-- Bubbles -->
                            <div class="bubble w-2 h-2 left-4 delay-100"></div>
                            <div class="bubble w-3 h-3 left-1/2 delay-300"></div>
                            <div class="bubble w-1 h-1 right-6 delay-75"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="w-full max-w-lg grid grid-cols-2 gap-4 mb-4 mt-6">
        <button onclick="clearMix()" class="col-span-1 py-4 rounded-2xl bg-slate-100 text-slate-600 font-bold hover:bg-slate-200 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-sm border border-slate-200">
            <span class="text-xl">↺</span> Reset Mix
        </button>
        <button onclick="checkMix()" class="col-span-1 py-4 rounded-2xl bg-purple-600 text-white font-bold hover:bg-purple-700 active:scale-95 transition-all shadow-lg shadow-purple-200">
            Test Result ⚗️
        </button>
        <button onclick="init()" class="col-span-2 py-3 rounded-xl text-slate-400 text-sm font-medium hover:text-slate-600 transition-colors">
            Skip to New Target
        </button>
    </div>

    <!-- Victory Modal -->
    <div id="victory-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white p-8 rounded-[40px] text-center shadow-2xl w-full max-w-sm relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-green-400 to-emerald-600"></div>
            <div class="text-6xl mb-4 animate-bounce">🧪</div>
            <h2 class="text-3xl font-black text-slate-800 mb-2">PERFECT MATCH!</h2>
            <p class="text-slate-500 mb-8">You created the exact formula.</p>
            <div class="flex gap-3">
                <button onclick="closeModal(); init();" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white py-4 rounded-2xl font-bold text-lg shadow-lg shadow-emerald-200 transition-all active:scale-95">
                    Next Level ➜
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Game Config ---
        const colorMap = {
            'red': [239, 68, 68],     // Tailwind Red-500
            'yellow': [250, 204, 21], // Tailwind Yellow-400
            'blue': [59, 130, 246]    // Tailwind Blue-500
        };

        const dotColors = {
            'red': 'bg-red-500',
            'yellow': 'bg-yellow-400',
            'blue': 'bg-blue-500'
        };

        // Challenges configured to match specific ratios
        const challenges = [
            { name: "Orange", rgb: [244, 136, 44], ingredients: ['red', 'yellow'], hint: "Equal parts Red and Yellow" },
            { name: "Deep Orange", rgb: [242, 102, 56], ingredients: ['red', 'red', 'yellow'], hint: "Mostly Red with some Yellow" },
            { name: "Green", rgb: [154, 167, 133], ingredients: ['blue', 'yellow'], hint: "Equal parts Blue and Yellow" },
            { name: "Lime", rgb: [186, 191, 79], ingredients: ['blue', 'yellow', 'yellow'], hint: "Mostly Yellow with a dash of Blue" },
            { name: "Purple", rgb: [149, 99, 157], ingredients: ['red', 'blue'], hint: "Red and Blue make..." },
            { name: "Deep Purple", rgb: [119, 109, 186], ingredients: ['blue', 'blue', 'red'], hint: "Mostly Blue with some Red" },
            { name: "Teal", rgb: [122, 179, 171], ingredients: ['blue', 'blue', 'yellow'], hint: "Cool ocean tone: Double Blue, one Yellow" },
            { name: "Gold", rgb: [247, 169, 37], ingredients: ['yellow', 'yellow', 'red'], hint: "Bright and sunny: Double Yellow, one Red" }
        ];

        // --- State ---
        let currentChallenge = null;
        let mixIngredients = [];
        let soundEnabled = true;
        let level = 1;

        // --- Elements ---
        const mixLiquid = document.getElementById('mix-liquid');
        const currentSwatch = document.getElementById('current-swatch');
        const instructionText = document.getElementById('instruction-text');
        const recipeTrack = document.getElementById('recipe-track');
        const emptyRecipeText = document.getElementById('empty-recipe-text');

        // --- Audio Context ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (!soundEnabled || audioCtx.state === 'suspended') {
                audioCtx.resume();
                if(!soundEnabled) return;
            }
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;

            if (type === 'drop') {
                // Water drop sound
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'win') {
                // Success chime
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.1);
                osc.frequency.setValueAtTime(1000, now + 0.2);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'error') {
                // Error buzzer
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').innerHTML = soundEnabled ? '🔊' : '🔇';
        }

        // --- Game Logic ---

        function init() {
            // Pick random challenge
            currentChallenge = challenges[Math.floor(Math.random() * challenges.length)];
            
            // Set Target UI
            document.getElementById('target-swatch').style.backgroundColor = `rgb(${currentChallenge.rgb.join(',')})`;
            document.getElementById('target-text-name').textContent = currentChallenge.name;
            document.getElementById('level-indicator').innerText = level;

            // Reset UI
            instructionText.innerHTML = `Mix colors to make <span class="font-bold text-slate-800">${currentChallenge.name}</span>!`;
            instructionText.className = "text-center text-slate-600 font-medium text-lg";
            clearMix();
        }

        function addIngredient(color) {
            if (mixIngredients.length >= 5) {
                shakeFlask();
                return;
            }
            
            // Visual Drop
            createDropAnimation(color);
            playSound('drop');

            // Logic
            mixIngredients.push(color);
            
            // UI Updates
            updateRecipeTrack();
            updateMixVisuals();
        }

        function createDropAnimation(color) {
            const drop = document.createElement('div');
            drop.className = 'falling-drop';
            drop.style.backgroundColor = `rgb(${colorMap[color].join(',')})`;
            drop.style.left = '50%';
            drop.style.marginLeft = '-12px'; // Center 24px width
            document.getElementById('drop-zone').appendChild(drop);
            setTimeout(() => drop.remove(), 600);
        }

        function updateRecipeTrack() {
            if (mixIngredients.length > 0) {
                emptyRecipeText.style.display = 'none';
            } else {
                emptyRecipeText.style.display = 'block';
            }

            // Rebuild dots
            // Note: We could optimize this to append only, but rebuilding is safer for 'undo' features later
            recipeTrack.innerHTML = '';
            if (mixIngredients.length === 0) {
                recipeTrack.appendChild(emptyRecipeText);
                return;
            }

            mixIngredients.forEach(color => {
                const dot = document.createElement('div');
                dot.className = `w-4 h-4 rounded-full border-2 border-white shadow-sm recipe-dot ${dotColors[color]}`;
                recipeTrack.appendChild(dot);
            });
        }

        function updateMixVisuals() {
            if (mixIngredients.length === 0) {
                mixLiquid.style.height = "0%";
                currentSwatch.style.backgroundColor = "#ffffff";
                return;
            }

            // Cap visual height at 85%
            const height = Math.min(mixIngredients.length * 17, 85);
            mixLiquid.style.height = height + "%";

            // Calculate Color
            let r=0, g=0, b=0;
            mixIngredients.forEach(c => {
                r += colorMap[c][0];
                g += colorMap[c][1];
                b += colorMap[c][2];
            });

            const count = mixIngredients.length;
            const finalColor = `rgb(${Math.round(r/count)}, ${Math.round(g/count)}, ${Math.round(b/count)})`;

            mixLiquid.style.backgroundColor = finalColor;
            currentSwatch.style.backgroundColor = finalColor;
        }

        function clearMix() {
            mixIngredients = [];
            updateRecipeTrack();
            updateMixVisuals();
            instructionText.textContent = "Flask emptied. Try again!";
            setTimeout(() => {
                if(mixIngredients.length === 0) instructionText.textContent = `Mix colors to make ${currentChallenge.name}!`;
            }, 2000);
        }

        function checkMix() {
            if (mixIngredients.length === 0) {
                instructionText.textContent = "The flask is empty! Add some colors first.";
                return;
            }

            // Calculate Result RGB
            let r=0, g=0, b=0;
            mixIngredients.forEach(c => {
                r += colorMap[c][0];
                g += colorMap[c][1];
                b += colorMap[c][2];
            });
            const count = mixIngredients.length;
            const currentRgb = [Math.round(r/count), Math.round(g/count), Math.round(b/count)];

            // Compare with Target
            const target = currentChallenge.rgb;
            
            // Euclidean distance
            const diff = Math.sqrt(
                Math.pow(currentRgb[0] - target[0], 2) +
                Math.pow(currentRgb[1] - target[1], 2) +
                Math.pow(currentRgb[2] - target[2], 2)
            );

            // Threshold
            if (diff < 30) {
                handleWin();
            } else {
                handleFail(currentRgb, target);
            }
        }

        function handleWin() {
            playSound('win');
            createConfetti();
            document.getElementById('victory-modal').style.display = 'flex';
            level++;
        }

        function handleFail(current, target) {
            playSound('error');
            shakeFlask();
            
            // Simple logic to generate a hint
            // Is it too red?
            let hint = "Not quite right. ";
            
            // Compare average R channel difference vs B vs G
            // This is a rough approximation for hints
            if (current[0] > target[0] + 40) hint += "Too much Red! ";
            else if (current[0] < target[0] - 40) hint += "Needs more Red? ";
            
            if (current[2] > target[2] + 40) hint += "Too much Blue! ";
            else if (current[2] < target[2] - 40) hint += "Needs more Blue? ";

            if (current[1] > target[1] + 40) hint += "Too much Yellow! "; // Green is mostly G
            
            if (hint === "Not quite right. ") hint = "Check the proportions. " + currentChallenge.hint;

            instructionText.textContent = hint;
            instructionText.className = "text-center text-red-500 font-bold text-lg animate-pulse";
        }

        function shakeFlask() {
            const flask = document.querySelector('.main-flask-container');
            flask.style.transform = "translateX(5px)";
            setTimeout(() => flask.style.transform = "translateX(-5px)", 50);
            setTimeout(() => flask.style.transform = "translateX(5px)", 100);
            setTimeout(() => flask.style.transform = "translateX(0)", 150);
        }

        function closeModal() {
            document.getElementById('victory-modal').style.display = 'none';
        }

        function createConfetti() {
            const colors = ['#ef4444', '#3b82f6', '#facc15', '#a855f7'];
            for(let i=0; i<50; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                conf.style.top = '-10px';
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 4000);
            }
        }

        // Start
        init();

    </script>
</body>
</html>
